name: Bug report
description: Something behaves differently from the documentation
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security issue here. Follow [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows it. Include the exact commands.
      placeholder: |
        1. wizrelay init --role backend
        2. /wizrelay:pull CU-86c1abcd
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: wizrelay doctor --json
      description: Paste the output. Redact any value you consider private.
      render: json
    validations:
      required: true
  - type: input
    id: cc-version
    attributes:
      label: Claude Code version
      placeholder: "v2.1.295"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, "Windows (Git Bash)", "Windows (PowerShell only)"]
    validations:
      required: true
  - type: dropdown
    id: persona
    attributes:
      label: Where did this happen
      options: ["Developer repository", "Team hub", "Neither / a plain directory", "CI"]
    validations:
      required: true
